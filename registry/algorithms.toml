# QuantumShield algorithm registry.
#
# This file is the single source of truth for every algorithm the platform may use. Entries are
# immutable once published: a parameter change is a new entry with a new id. The only field that
# may change is `status`, and only forwards: active -> deprecated -> disabled. The loader
# (crates/qshield-crypto/src/registry.rs) enforces these rules and refuses to start otherwise.
#
# status semantics
#   active      generate new keys, use existing keys, rotate into
#   deprecated  use existing keys for decapsulate/verify only; no generation, no signing, flagged
#   disabled    refused everywhere
#
# Every id appears in stored key records, envelopes, wire headers and CBOM entries.

registry_version = 2

# ---------------------------------------------------------------------------------------------
# Key encapsulation
# ---------------------------------------------------------------------------------------------

[[algorithm]]
id = "ml-kem-512"
version = 1
family = "kem"
standard = "FIPS 203"
oid = "2.16.840.1.101.3.4.4.1"
nist_level = 1
status = "deprecated"
deprecated = "2026-11-03"
quantum_safe = true
public_key_len = 800
secret_key_len = 1632
ciphertext_len = 768
shared_secret_len = 32
implementation = "PQClean clean (via pqcrypto)"
introduced = "2026-11-03"
notes = "Sample deprecation: level 1 is below the platform minimum of level 3. Existing keys decapsulate; migration 0003 flags them for rotation."

